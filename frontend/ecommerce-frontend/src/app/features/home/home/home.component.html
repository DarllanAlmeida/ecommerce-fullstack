<main class="home">

    <!-- HERO -->

    <app-hero></app-hero>

    <!-- CATEGORÍAS -->

    <app-categories></app-categories>

    <!-- PRODUCTOS DESTACADOS -->

    <app-featured-products></app-featured-products>

    <!-- MARCAS -->

    <section class="brands">

        <div class="container">

            <div class="section-header">

                <span class="section-tag">

                    TOP BRANDS

                </span>

                <h2>

                    Las mejores marcas

                </h2>

                <p>

                    Trabajamos con las marcas deportivas más reconocidas
                    para ofrecer la mejor calidad.

                </p>

            </div>

            <div class="brands-grid">

                <img
                    src="/images/brands/nike.png"
                    alt="Nike">

                <img
                    src="/images/brands/adidas.png"
                    alt="Adidas">

                <img
                    src="/images/brands/puma.png"
                    alt="Puma">

                <img
                    src="/images/brands/new-balance.png"
                    alt="New Balance">

            </div>

        </div>

    </section>

    <!-- NEWSLETTER -->

    <section class="newsletter">

        <div class="container newsletter-box">

            <span class="section-tag">

                JOIN THE COMMUNITY

            </span>

            <h2>

                Recibe antes que nadie
                los nuevos lanzamientos

            </h2>

            <p>

                Suscríbete para recibir novedades,
                promociones y colecciones exclusivas.

            </p>

            <form>

                <input
                    type="email"
                    placeholder="Tu correo electrónico">

                <button>

                    Suscribirme

                </button>

            </form>

        </div>

    </section>

</main>
