<section class="featured-products">

  <div class="container">

    <div class="section-header">

      <span class="subtitle">

        NUESTRA SELECCIÓN

      </span>

      <h2>

        Productos Destacados

      </h2>

      <p>

        Descubre las zapatillas más populares de Sneakers Shop.

      </p>

    </div>

    <div
      *ngIf="loading"
      class="loading">

      Cargando productos...

    </div>

    <div
      *ngIf="!loading"
      class="products-grid">

      <app-product-card
        *ngFor="let product of products"
        [product]="product"
        (add)="addToCart($event)">
      </app-product-card>

    </div>

  </div>

</section>
